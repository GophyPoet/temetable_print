<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Расписание → PDF</title>
<style>
:root {
    --primary: #2563eb;
    --primary-hover: #1d4ed8;
    --success: #16a34a;
    --error: #dc2626;
    --bg: #f8fafc;
    --card: #ffffff;
    --border: #e2e8f0;
    --text: #1e293b;
    --muted: #64748b;
}
* { margin:0; padding:0; box-sizing:border-box; }
body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 2rem 1rem;
}
.container {
    width: 100%;
    max-width: 640px;
}
h1 {
    font-size: 1.5rem;
    margin-bottom: 0.25rem;
}
.subtitle {
    color: var(--muted);
    font-size: 0.9rem;
    margin-bottom: 1.5rem;
}
/* Drop zone */
.dropzone {
    border: 2px dashed var(--border);
    border-radius: 12px;
    padding: 2.5rem 1.5rem;
    text-align: center;
    cursor: pointer;
    transition: border-color .2s, background .2s;
    background: var(--card);
}
.dropzone:hover, .dropzone.dragover {
    border-color: var(--primary);
    background: #eff6ff;
}
.dropzone-icon { font-size: 2.5rem; margin-bottom: 0.5rem; }
.dropzone-text { color: var(--muted); font-size: 0.95rem; }
.dropzone-text b { color: var(--primary); }
.dropzone input { display: none; }
/* File list */
.file-list {
    margin-top: 1rem;
    display: flex;
    flex-direction: column;
    gap: 0.4rem;
}
.file-item {
    display: flex;
    align-items: center;
    justify-content: space-between;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 0.5rem 0.75rem;
    font-size: 0.9rem;
}
.file-item .name { flex:1; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.file-item .remove {
    background: none; border: none; color: var(--error); cursor: pointer;
    font-size: 1.1rem; padding: 0 0.25rem; margin-left: 0.5rem;
}
/* Buttons */
.btn {
    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 0.4rem;
    padding: 0.7rem 1.5rem;
    border: none;
    border-radius: 8px;
    font-size: 1rem;
    font-weight: 600;
    cursor: pointer;
    transition: background .2s;
    width: 100%;
    margin-top: 1rem;
}
.btn-primary { background: var(--primary); color:#fff; }
.btn-primary:hover { background: var(--primary-hover); }
.btn-primary:disabled { opacity:.5; cursor:not-allowed; }
.btn-success { background: var(--success); color:#fff; }
.btn-success:hover { opacity:.9; }
/* Status */
.status {
    margin-top: 1rem;
    padding: 1rem;
    border-radius: 8px;
    font-size: 0.9rem;
    display: none;
}
.status.loading { display:block; background:#eff6ff; color:var(--primary); }
.status.success { display:block; background:#f0fdf4; color:var(--success); }
.status.error   { display:block; background:#fef2f2; color:var(--error); }
/* Report */
.report {
    margin-top: 1rem;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 1rem;
    font-size: 0.85rem;
    display: none;
}
.report h3 { font-size: 0.95rem; margin-bottom: 0.5rem; }
.report ul { list-style: none; padding: 0; }
.report li { padding: 0.15rem 0; }
.report li::before { content: "• "; color: var(--muted); }
.report .skipped { color: var(--muted); font-style: italic; }
.report .skipped::before { content: "⊘ "; }
.spinner {
    display: inline-block;
    width: 1rem; height: 1rem;
    border: 2px solid #fff;
    border-top-color: transparent;
    border-radius: 50%;
    animation: spin .6s linear infinite;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>
<div class="container">
    <h1>Расписание → PDF</h1>
    <p class="subtitle">Загрузите Excel-файлы с расписанием, получите готовый PDF для печати</p>

    <div class="dropzone" id="dropzone">
        <div class="dropzone-icon">📄</div>
        <div class="dropzone-text">
            Перетащите файлы сюда или <b>нажмите для выбора</b><br>
            <small>.xlsx</small>
        </div>
        <input type="file" id="fileInput" multiple accept=".xlsx,.xls">
    </div>

    <div class="file-list" id="fileList"></div>

    <button class="btn btn-primary" id="processBtn" disabled>
        Сформировать PDF
    </button>

    <div class="status" id="status"></div>
    <div class="report" id="report"></div>
    <div id="downloadArea"></div>
</div>

<script>
const dropzone = document.getElementById("dropzone");
const fileInput = document.getElementById("fileInput");
const fileList = document.getElementById("fileList");
const processBtn = document.getElementById("processBtn");
const status = document.getElementById("status");
const report = document.getElementById("report");
const downloadArea = document.getElementById("downloadArea");

let selectedFiles = [];

// Drag & drop
dropzone.addEventListener("click", () => fileInput.click());
dropzone.addEventListener("dragover", e => { e.preventDefault(); dropzone.classList.add("dragover"); });
dropzone.addEventListener("dragleave", () => dropzone.classList.remove("dragover"));
dropzone.addEventListener("drop", e => {
    e.preventDefault();
    dropzone.classList.remove("dragover");
    addFiles(e.dataTransfer.files);
});
fileInput.addEventListener("change", () => { addFiles(fileInput.files); fileInput.value = ""; });

function addFiles(fileListObj) {
    for (const f of fileListObj) {
        if (!selectedFiles.some(s => s.name === f.name && s.size === f.size)) {
            selectedFiles.push(f);
        }
    }
    renderFileList();
}

function renderFileList() {
    fileList.innerHTML = "";
    selectedFiles.forEach((f, i) => {
        const div = document.createElement("div");
        div.className = "file-item";
        div.innerHTML = `<span class="name">${f.name}</span>
            <span style="color:var(--muted);font-size:.8rem;margin-left:.5rem">${(f.size/1024).toFixed(0)} КБ</span>
            <button class="remove" data-idx="${i}">&times;</button>`;
        fileList.appendChild(div);
    });
    processBtn.disabled = selectedFiles.length === 0;
    // Reset state on file change
    status.className = "status";
    report.style.display = "none";
    downloadArea.innerHTML = "";
}

fileList.addEventListener("click", e => {
    if (e.target.classList.contains("remove")) {
        selectedFiles.splice(parseInt(e.target.dataset.idx), 1);
        renderFileList();
    }
});

// Process
processBtn.addEventListener("click", async () => {
    if (selectedFiles.length === 0) return;
    const formData = new FormData();
    selectedFiles.forEach(f => formData.append("files", f));

    processBtn.disabled = true;
    processBtn.innerHTML = '<span class="spinner"></span> Обработка...';
    status.className = "status loading";
    status.textContent = "Обработка файлов и генерация PDF...";
    report.style.display = "none";
    downloadArea.innerHTML = "";

    try {
        const res = await fetch("/api/upload", { method: "POST", body: formData });
        const data = await res.json();

        if (data.success) {
            status.className = "status success";
            status.textContent = `Готово! Обработано страниц: ${data.report.total_pages}`;
            showReport(data.report);
            downloadArea.innerHTML = `<a href="${data.report.pdf_url}" class="btn btn-success" download>
                Скачать PDF (${data.report.total_pages} стр.)
            </a>`;
        } else {
            status.className = "status error";
            status.textContent = data.error || "Ошибка обработки";
            if (data.report) showReport(data.report);
        }
    } catch (err) {
        status.className = "status error";
        status.textContent = `Ошибка сети: ${err.message}`;
    } finally {
        processBtn.disabled = false;
        processBtn.innerHTML = "Сформировать PDF";
    }
});

function showReport(r) {
    let html = "";
    if (r.processed_sheets && r.processed_sheets.length) {
        html += `<h3>Обработанные листы (${r.processed_sheets.length})</h3><ul>`;
        r.processed_sheets.forEach(s => {
            html += `<li><b>${s.sheet}</b> — ${s.title} <small style="color:var(--muted)">(${s.file})</small></li>`;
        });
        html += "</ul>";
    }
    if (r.skipped_sheets && r.skipped_sheets.length) {
        html += `<h3>Пропущенные листы</h3><ul>`;
        r.skipped_sheets.forEach(s => {
            html += `<li class="skipped">${s.sheet} — ${s.reason}</li>`;
        });
        html += "</ul>";
    }
    if (r.errors && r.errors.length) {
        html += `<h3 style="color:var(--error)">Ошибки</h3><ul>`;
        r.errors.forEach(e => { html += `<li style="color:var(--error)">${e}</li>`; });
        html += "</ul>";
    }
    if (html) {
        report.innerHTML = html;
        report.style.display = "block";
    }
}
</script>
</body>
</html>
